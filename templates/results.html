{% extends "base.html" %}

{% block title %}Prediction Results - AgriDetect{% endblock %}

{% block content %}
<section class="results-section py-5">
    <div class="container">
        <div id="predictionResults" class="glass-card p-4">
            <div class="d-flex justify-content-center align-items-center gap-3">
                <div class="spinner-border text-cyan" role="status"></div>
                <span class="text-muted">Retrieving AI analysis...</span>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
let currentResultPredictionId = null;

function createProbabilityBar(disease, probability) {
    const probPercent = Number(probability) * 100;
    return `
        <li class="probability-item">
            <div class="probability-label">${disease}</div>
            <div class="probability-bar-container">
                <div class="probability-bar" style="width: ${probPercent}%"></div>
            </div>
            <div class="probability-percent">${probPercent.toFixed(1)}%</div>
        </li>
    `;
}

function severityBadgeClass(severity) {
    if (!severity) return 'severity-low';
    const normalized = severity.toString().toLowerCase();
    if (normalized.includes('high') || normalized.includes('severe')) return 'severity-high';
    if (normalized.includes('moderate') || normalized.includes('medium') || normalized.includes('mid')) return 'severity-moderate';
    return 'severity-low';
}

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const predictionId = urlParams.get('id');

    if (!predictionId) {
        renderError('No prediction ID found in the URL. Please make a new prediction.');
        return;
    }

    currentResultPredictionId = predictionId;
    loadPredictionResults(predictionId);
});

async function loadPredictionResults(predictionId) {
    try {
        const response = await fetch(`/api/prediction/${predictionId}`);
        if (!response.ok) throw new Error('Prediction request failed');
        const data = await response.json();

        const pred = data.prediction || data;

        if (!pred) {
            renderError('Prediction data is unavailable for this ID.');
            return;
        }

        const safeText = (value, fallback = 'Not Available') => {
            const text = value === null || value === undefined ? '' : String(value).trim();
            return text || fallback;
        };

        const confidencePercent = Number(pred.confidence) * 100;
        const severityClassName = severityBadgeClass(pred.severity || pred.severity_label || 'low');
        const severityLabel = pred.severity || pred.severity_label || (confidencePercent >= 80 ? 'High' : confidencePercent >= 60 ? 'Moderate' : 'Low');

        const probabilityList = pred.all_probabilities
            ? Object.entries(pred.all_probabilities).map(([disease, value]) => createProbabilityBar(disease, value)).join('')
            : '<li class="text-muted">No probability breakdown available.</li>';

        const adviceHtml = safeText(pred.ai_advice, '') ? `
            <div class="ai-advice-card mt-4">
                <div class="card-header">AI Recommendation</div>
                <div class="card-body">
                    <p>${escapeHtml(safeText(pred.ai_advice, 'AI advice is not available for this prediction.')).replace(/\n/g, '<br>')}</p>
                </div>
            </div>
        ` : '';

        const structuredAdviceHtml = typeof buildAgriculturalRecommendationSections === 'function'
            ? buildAgriculturalRecommendationSections(pred)
            : '';

        const fertilizerName = safeText(pred.fertilizer_name || pred.fertilizer_recommendation, 'Recommended fertilizer not available');
        const npkValues = safeText(pred.npk_values, 'N/A');
        const applicationTiming = safeText(pred.application_timing || pred.application_schedule, 'Apply when the crop is not stressed.');
        const sprayingInterval = safeText(pred.spraying_interval, 'Repeat per product label or every 7-10 days.');
        const fertilizerNotes = safeText(pred.fertilizer_notes, 'Use product labels and local guidance for safe application.');
        const organicAlternative = safeText(pred.organic_alternative, 'Use compost, vermicompost, or organic biostimulants.');
        const historyItems = (data.fertilizer_history || []).map(item => `
            <div class="recommendation-card mb-3">
                <h5 class="recommendation-card__header"><i class="fas fa-seedling"></i> ${escapeHtml(item.fertilizer || 'Fertilizer')}</h5>
                <div class="recommendation-card__body">
                    <p><strong>Disease:</strong> ${escapeHtml(item.disease)}</p>
                    <p><strong>Dosage:</strong> ${escapeHtml(item.dosage || 'N/A')}</p>
                    <p><strong>Timing:</strong> ${escapeHtml(item.timing || 'N/A')}</p>
                    <p>${escapeHtml(item.notes || 'No additional notes')}</p>
                </div>
            </div>
        `).join('');

        const dangerAlert = (severityLabel.toLowerCase().includes('high') || (pred.disease || '').toLowerCase().indexOf('healthy') < 0)
            ? `<div class="alert alert-warning" role="alert">
                    <i class="fas fa-exclamation-triangle"></i>
                    High-priority action recommended for this diagnosis. Follow the fertilizer guidance carefully and avoid overapplication.
               </div>`
            : '';

        document.getElementById('predictionResults').innerHTML = `
            ${dangerAlert}
            <div class="result-layout">
                <!-- LEFT PANEL: Image + Prediction Snapshot -->
                <section class="result-left-panel">
                    <div class="glass-card preview-card image-preview">
                        <img src="${escapeHtml(pred.image_path || '/static/images/placeholder.png')}" alt="Analyzed Image" class="img-fluid rounded-3" />
                    </div>

                    <div class="result-summary-panel">
                        <div class="section-kicker">Prediction Snapshot</div>
                        <h3 class="section-title">${escapeHtml(pred.disease || 'Unknown Disease')}</h3>
                        
                        <div class="result-summary-grid">
                            <div class="summary-item">
                                <span>Crop</span>
                                <strong>${escapeHtml(pred.crop || 'Unknown')}</strong>
                            </div>
                            <div class="summary-item">
                                <span>Severity</span>
                                <strong>${escapeHtml(severityLabel)}</strong>
                            </div>
                            <div class="summary-item">
                                <span>Prediction ID</span>
                                <strong>${escapeHtml(pred.id || predictionId)}</strong>
                            </div>
                            <div class="summary-item">
                                <span>Captured</span>
                                <strong>${new Date(pred.created_at || Date.now()).toLocaleString()}</strong>
                            </div>
                        </div>

                        <div class="confidence-block">
                            <div class="confidence-label d-flex justify-content-between align-items-center mb-2">
                                <span>Prediction Confidence</span>
                                <strong>${confidencePercent.toFixed(1)}%</strong>
                            </div>
                            <div class="confidence-bar-wrapper">
                                <div class="confidence-bar-fill" style="width: ${confidencePercent}%"></div>
                            </div>
                        </div>

                        <div class="d-flex flex-wrap gap-2 align-items-center mt-4 mb-2">
                            <span class="severity-badge ${severityClassName}">${escapeHtml(severityLabel)}</span>
                            <span class="badge bg-info text-dark">${confidencePercent.toFixed(1)}% confidence</span>
                        </div>

                        <div class="action-group">
                            <button class="btn btn-glow" onclick="printResults()"><i class="fas fa-print"></i> Print</button>
                            <button class="btn btn-outline-primary" onclick="downloadReport()"><i class="fas fa-download"></i> Download</button>
                            <button class="btn btn-outline-secondary" onclick="shareResults()"><i class="fas fa-share-alt"></i> Share</button>
                        </div>
                    </div>
                </section>

                <!-- RIGHT PANEL: Treatment Guidance + Cards -->
                <section class="result-right-panel">
                    <div class="treatment-card">
                        <div class="section-kicker">Fertilizer Guidance</div>
                        <h4 class="section-title">Nutrition & Treatment Plan</h4>
                        
                        <div class="result-card-grid">
                            <article class="recommendation-card">
                                <div class="recommendation-card__header"><i class="fas fa-flask"></i> Fertilizer Blend</div>
                                <div class="recommendation-card__body">
                                    <p><strong>Name:</strong> ${escapeHtml(fertilizerName)}</p>
                                    <p><strong>NPK:</strong> ${escapeHtml(npkValues)}</p>
                                    <p><strong>Dosage:</strong> ${escapeHtml(pred.dosage || 'N/A')}</p>
                                    <p>${escapeHtml(fertilizerNotes)}</p>
                                </div>
                            </article>
                            <article class="recommendation-card">
                                <div class="recommendation-card__header"><i class="fas fa-clock"></i> Application Timing</div>
                                <div class="recommendation-card__body">
                                    <p>${escapeHtml(applicationTiming)}</p>
                                    <p><strong>Interval:</strong> ${escapeHtml(sprayingInterval)}</p>
                                </div>
                            </article>
                            <article class="recommendation-card prevention-card">
                                <div class="recommendation-card__header"><i class="fas fa-shield-heart"></i> Prevention Tips</div>
                                <div class="recommendation-card__body">
                                    <p>${escapeHtml(pred.prevention_tips || 'No prevention tips generated.')}</p>
                                </div>
                            </article>
                            <article class="recommendation-card">
                                <div class="recommendation-card__header"><i class="fas fa-leaf"></i> Organic Alternative</div>
                                <div class="recommendation-card__body">
                                    <p>${escapeHtml(organicAlternative)}</p>
                                </div>
                            </article>
                        </div>
                    </div>

                    <div class="probability-analysis-card">
                        <div class="section-kicker">Probability Analysis</div>
                        <h4 class="section-title">Disease Likelihood Breakdown</h4>
                        <ul class="probability-list">${probabilityList}</ul>
                    </div>
                </section>
            </div>

            ${adviceHtml}
            ${structuredAdviceHtml}
            ${historyItems ? `
                <div class="glass-card p-4 mt-4">
                    <h4 class="section-title mb-3">Recent Fertilizer Recommendations</h4>
                    ${historyItems}
                </div>
            ` : ''}

            <div class="glass-card p-4 mt-4 text-center">
                <a href="/upload" class="btn btn-glow me-2"><i class="fas fa-cloud-upload-alt"></i> Analyze Another Image</a>
                <a href="/history" class="btn btn-outline-primary"><i class="fas fa-history"></i> View History</a>
            </div>
        `;
    } catch (error) {
        console.error('Error loading results:', error);
        renderError('Unable to retrieve prediction results at this time.');
    }
}

function renderNpkChart(npkValues) {
    const canvas = document.getElementById('npkChart');
    if (!canvas || typeof Chart === 'undefined') return;

    const destroyChart = typeof destroyChartIfExists === 'function'
        ? destroyChartIfExists
        : function (canvasOrId) {
            try {
                const existingChart = typeof Chart.getChart === 'function' ? Chart.getChart(canvasOrId) : null;
                if (existingChart && typeof existingChart.destroy === 'function') {
                    existingChart.destroy();
                    return;
                }
            } catch (error) {
                // Ignore chart lookup failures and fall back to redraw.
            }

            const targetCanvas = typeof canvasOrId === 'string' ? document.getElementById(canvasOrId) : canvasOrId;
            if (targetCanvas && targetCanvas.chart && typeof targetCanvas.chart.destroy === 'function') {
                targetCanvas.chart.destroy();
            }
        };

    const parts = String(npkValues || '')
        .split(/[^0-9\.]+/)
        .map(v => Number(v))
        .filter(v => !Number.isNaN(v));

    const labels = ['Nitrogen', 'Phosphorus', 'Potassium'];
    const values = [0, 0, 0];

    if (parts.length >= 3) {
        values[0] = parts[0];
        values[1] = parts[1];
        values[2] = parts[2];
    } else if (parts.length > 0) {
        values.splice(0, parts.length, ...parts);
    }

    destroyChart(canvas);

    new Chart(canvas, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'NPK Ratio',
                data: values,
                backgroundColor: [
                    'rgba(46, 196, 255, 0.94)',
                    'rgba(61, 220, 132, 0.92)',
                    'rgba(255, 203, 66, 0.92)'
                ],
                borderColor: 'rgba(255, 255, 255, 0.18)',
                borderWidth: 1.2,
                borderRadius: 18,
                borderSkipped: false,
                maxBarThickness: 30,
                barThickness: 20,
                barPercentage: 0.7,
                categoryPercentage: 0.75
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
                duration: 700,
                easing: 'easeOutQuart'
            },
            layout: {
                padding: {
                    top: 6,
                    right: 6,
                    bottom: 6,
                    left: 6
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: 'rgba(230, 247, 255, 0.88)',
                        font: { family: 'Poppins', size: 12 }
                    },
                    grid: { display: false },
                    border: { color: 'rgba(255, 255, 255, 0.12)' }
                },
                y: {
                    beginAtZero: true,
                    suggestedMax: Math.max(4, Math.max(...values) + 2),
                    ticks: {
                        color: 'rgba(230, 247, 255, 0.82)',
                        font: { family: 'Poppins', size: 12 },
                        stepSize: Math.max(1, Math.ceil(Math.max(...values) / 4))
                    },
                    grid: {
                        color: 'rgba(255, 255, 255, 0.08)',
                        borderDash: [4, 5]
                    },
                    border: { color: 'rgba(255, 255, 255, 0.12)' }
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    enabled: true,
                    backgroundColor: 'rgba(4, 9, 20, 0.96)',
                    titleColor: '#ffffff',
                    bodyColor: '#e8f8ff',
                    borderColor: 'rgba(255, 255, 255, 0.12)',
                    borderWidth: 1,
                    padding: 12,
                    displayColors: false,
                    callbacks: {
                        label: context => `${context.dataset.label}: ${context.parsed.y}`
                    }
                }
            }
        }
    });
}

function renderError(message) {
    document.getElementById('predictionResults').innerHTML = `
        <div class="glass-card p-4 text-center">
            <div class="alert alert-warning mb-4" role="alert">
                <i class="fas fa-exclamation-circle"></i> ${escapeHtml(message)}
            </div>
            <a href="/upload" class="btn btn-glow">Analyze New Image</a>
        </div>
    `;
}

function printResults() {
    window.print();
}

function downloadReport() {
    if (!currentResultPredictionId) {
        renderError('Prediction report is not available yet.');
        return;
    }
    window.location.href = `/download-report/${currentResultPredictionId}`;
}

function shareResults() {
    if (navigator.share) {
        navigator.share({
            title: 'AgriDetect Prediction Results',
            text: 'Check out my crop analysis from AgriDetect!',
            url: window.location.href
        }).catch(err => console.log('Error sharing:', err));
    } else {
        alert('Copy this link to share: ' + window.location.href);
    }
}
</script>
{% endblock %}
