{% extends "base.html" %}

{% block title %}Login - AgriDetect{% endblock %}

{% block content %}
<section class="hero-section py-5">
    <div class="container">
        <div class="glass-card p-5 mx-auto" style="max-width: 540px;">
            <div class="text-center mb-4">
                <div class="brand-icon mb-3"><i class="fas fa-leaf"></i></div>
                <h1 class="hero-title mb-2">Welcome Back</h1>
                <p class="hero-copy text-muted">Sign in to your AgriDetect account and continue AI-powered crop monitoring.</p>
            </div>

            <form id="loginForm">
                <div class="mb-4">
                    <label for="username" class="form-label">Username or Email</label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="mb-4 form-check form-switch text-muted">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-glow btn-lg w-100">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-4 text-muted">
                <p class="mb-2">New to AgriDetect? <a href="/register" class="text-cyan">Create an account</a></p>
                <p class="small">Forgot your password? <a href="#" class="text-cyan">Reset it here</a></p>
            </div>
        </div>
    </div>
</section>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    showLoading(true);

    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            showToast('Login successful! Redirecting...', 'success', 1500);
            setTimeout(() => window.location.href = '/dashboard', 1500);
        } else {
            const data = await response.json();
            showToast(data.error || 'Login failed', 'error');
        }
    } catch (error) {
        showToast('Login error: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
});
</script>
{% endblock %}
